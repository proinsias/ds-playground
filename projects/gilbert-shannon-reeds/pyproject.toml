[project]
name = "gilbert-shannon-reeds"
version = "0.0.1"
description = "Python implementation of the Gilbert-Shannon-Reeds model for shuffling playing cards."
license = { text = "MIT License" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",

]

dependencies = [
    "certifi>=2026.10.19",  # PYSEC-2026-4320.
    "ds-utils",
    "pillow>=13.0.0; python_version >= '3.11'",  # CVE-2026-112390 and others; 13.x needs Python 3.11+.
    "toml>=0.10.2",
    "ipykernel>=6.16.1",
    "ipython>=8.5.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.6.1",
    "notebook>=6.5.1", # CVE-2020-26215
    "nbconvert>=7.17.2",
    "numpy>=1.23.4",
    "Pillow>=13.0.0",
    "scikit-learn>=1.1.2",
    "scipy>=1.9.3",
    "pyyaml>=6.0",
]

[build-system]
# Needed to ensure uv sync will auto-add the project as editable dependency.
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "flake8>=5.0.4",
    "pycodestyle>=2.9.1",
    "pydocstyle>=6.1.1",
    "pyflakes>=2.5.0",
    "pylint>=2.15.4",
    "pytest>=7.1.3",
    "yamllint>=1.28.0",
]

[tool.uv.sources]
ds-utils = { path = "../ds-utils", editable = true }
