pull_request_rules:
  - name: label Python changes
    conditions:
      - files ~= \.py$
    actions:
      label:
        add:
          - python

  - name: label Jupyter notebook changes
    conditions:
      - files ~= \.ipynb$
    actions:
      label:
        add:
          - notebooks

  - name: label CI / GitHub config changes
    conditions:
      - files ~= ^\.github/
    actions:
      label:
        add:
          - ci

  - name: label dependency changes
    conditions:
      - files ~= 
        (pyproject\.toml|uv\.lock|mise\.toml|\.pre-commit-config\.yaml)$
    actions:
      label:
        add:
          - dependencies

  - name: block WIP pull requests
    conditions:
      - label = wip
    actions:
      comment:
        message: >
          This pull request is marked **WIP** and will not be merged until the
          `wip` label is removed.

  - name: dismiss stale reviews on new commits
    conditions:
      - base = main
    actions:
      dismiss_reviews:
        changes_requested: true
        approved: true
        message: Approval dismissed — new commits were pushed.

  - name: auto-merge when approved and checks pass
    conditions:
      - base = main
      - "#approved-reviews-by >= 1"
      - label != wip
      - "#changes-requested-reviews-by = 0"
    actions:
      merge:
        method: squash

  - name: auto-merge dependency bot updates when CI passes
    # No human review required: merge as soon as every CI check has finished
    # and none failed. Mergify re-evaluates on each check status change.
    conditions:
      - base = main
      - or:
          - author = dependabot[bot]
          - author = renovate[bot]
      - label != wip
      - "#changes-requested-reviews-by = 0"
      - "#check-failure = 0"
      - "#check-pending = 0"
      - "#check-stale = 0"
    actions:
      merge:
        method: squash

merge_protections:
  - name: Require approval before merging to main
    if:
      - base = main
    success_conditions:
      # Dependency bots are exempt from the manual review requirement.
      - or:
          - "#approved-reviews-by >= 1"
          - author = dependabot[bot]
          - author = renovate[bot]
      - label != wip
      - "#changes-requested-reviews-by = 0"
