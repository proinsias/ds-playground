---
default_install_hook_types:
    - commit-msg
    - prepare-commit-msg
    - pre-commit
    - pre-merge-commit
    - pre-push
    - pre-rebase
    - post-checkout
    - post-commit
    - post-merge
    - post-rewrite

repos:
    - repo: local
      hooks:
          - id: prek-autoupdate
            name: prek autoupdate
            entry: prek autoupdate
            language: system
            pass_filenames: false
            always_run: true
            stages: [pre-push]

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          # General
          - id: check-added-large-files
          - id: check-case-conflict
          - id: check-executables-have-shebangs
          - id: check-merge-conflict
          - id: check-symlinks
          - id: check-toml
          - id: check-xml
          - id: check-yaml
          - id: detect-private-key
          - id: end-of-file-fixer
          - id: fix-byte-order-marker
          - id: mixed-line-ending # Replaces or checks mixed line ending.
          - id: trailing-whitespace

          # Json
          - id: check-json

          # Python
          - id: check-ast # Check whether files parse as valid python.
          - id: check-builtin-literals # Require literal syntax when initializing empty or zero Python builtin types.
          - id: check-docstring-first
          - id: debug-statements # Check for debugger imports and py37+ breakpoint() calls in python source.
          - id: name-tests-test # Assert that files in tests/ end in _test.py, or optionally test*.py
          - id: requirements-txt-fixer

    # General

    - repo: https://github.com/sirosen/texthooks
      rev: 0.7.1
      hooks:
          - id: fix-smartquotes
          - id: fix-ligatures

    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: v4.0.0-alpha.8
      hooks:
          - id: prettier
            stages: [pre-commit]

    # Git

    - repo: https://github.com/jorisroovers/gitlint
      rev: v0.19.1
      hooks:
          - id: gitlint

    # Python

    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.12.1
      hooks:
          # Keep uv.lock file up to date
          - id: uv-lock
            args: [--upgrade]
            # Update the project's environment
          - id: uv-sync
            args: [--dev, --locked]
            # Audit the project's dependencies
          - id: uv-audit
            env:
                UV_MALWARE_CHECK: "1"
          - id: uv-lock
            name: uv-lock-disease-risk-prediction
            args: [--directory, projects/disease-risk-prediction, --upgrade]
          - id: uv-sync
            name: uv-sync-disease-risk-prediction
            args:
                [--dev, --locked, --directory, projects/disease-risk-prediction]
            # Audit the project's dependencies
          - id: uv-audit
            name: uv-audit-disease-risk-prediction
            args: [--directory, projects/disease-risk-prediction]
            env:
                UV_MALWARE_CHECK: "1"
          - id: uv-lock
            name: uv-lock-gilbert-shannon-reeds
            args: [--directory, projects/gilbert-shannon-reeds, --upgrade]
          - id: uv-sync
            name: uv-sync-gilbert-shannon-reeds
            args: [--dev, --locked, --directory, projects/gilbert-shannon-reeds]
            # Audit the project's dependencies
          - id: uv-audit
            name: uv-audit-gilbert-shannon-reeds
            args: [--directory, projects/gilbert-shannon-reeds]
            env:
                UV_MALWARE_CHECK: "1"
          - id: uv-lock
            name: uv-lock-ds-utils
            args: [--directory, projects/ds-utils, --upgrade]
          - id: uv-sync
            name: uv-sync-ds-utils
            args: [--dev, --locked, --directory, projects/ds-utils]
            # Audit the project's dependencies
          - id: uv-audit
            name: uv-audit-ds-utils
            args: [--directory, projects/ds-utils]
            env:
                UV_MALWARE_CHECK: "1"

    - repo: https://github.com/tsvikas/sync-with-uv
      rev: v0.6.0
      hooks:
          - id: sync-with-uv

    - repo: https://github.com/econchick/interrogate
      rev: 1.7.0
      hooks:
          - id: interrogate
            args:
                - --verbose

    - repo: https://github.com/ikamensh/flynt/
      rev: 1.0.6
      hooks:
          - id: flynt

    - repo: https://github.com/MarcoGorelli/auto-walrus
      rev: 0.4.1
      hooks:
          - id: auto-walrus

    - repo: https://github.com/asottile/add-trailing-comma
      rev: v4.0.0
      hooks:
          - id: add-trailing-comma

    - repo: https://github.com/PyCQA/bandit
      rev: 1.9.4
      hooks:
          - id: bandit

    - repo: https://github.com/albertas/deadcode
      rev: 2.4.1
      hooks:
          - id: deadcode

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: "v0.16.1"
      hooks:
          - id: ruff-check
            args: [--fix, --exit-non-zero-on-fix]
            # types_or: [python, pyi, jupyter] # Run on notebooks too.
          - id: ruff-format
            # types_or: [python, pyi, jupyter] # Run on notebooks too.

    # Runs on everything in repo even unpaired scripts.
    # - repo: https://github.com/mwouts/jupytext
    #   rev: v1.14.7
    #   hooks:
    #       - id: jupytext
    #         args: [--sync]

    - repo: https://github.com/hadialqattan/pycln
      rev: v2.6.0
      hooks:
          - id: pycln

    - repo: https://github.com/MarcoGorelli/absolufy-imports
      rev: v0.3.1
      hooks:
          - id: absolufy-imports

    - repo: https://github.com/pre-commit/pygrep-hooks
      rev: v1.10.0
      hooks:
          - id: python-check-blanket-noqa
          - id: python-check-blanket-type-ignore
          - id: python-check-mock-methods
          - id: python-no-eval
          - id: python-no-log-warn
          - id: python-use-type-annotations
          - id: rst-backticks
          - id: rst-directive-colons
          - id: rst-inline-touching-normal
          - id: text-unicode-replacement-char

    - repo: https://gitlab.com/smop/pre-commit-hooks
      rev: v1.0.0
      hooks:
          - id: check-poetry # Validates the structure of the pyproject.toml file.

    # YAML

    - repo: https://github.com/adrienverge/yamllint
      rev: v1.38.0
      hooks:
          - id: yamllint
            args: [-c=.yamllint.yml]

    # SQL

    - repo: https://github.com/sqlfluff/sqlfluff
      rev: 4.2.2
      hooks:
          - id: sqlfluff-lint
          # For dbt projects, this installs the dbt "extras".
          # You will need to select the relevant dbt adapter for your dialect
          # (https://docs.getdbt.com/docs/available-adapters):
          # additional_dependencies: ['<dbt-adapter>', 'sqlfluff-templater-dbt']
          - id: sqlfluff-fix
          # Arbitrary arguments to show an example
          # args: [--rules, "L003,L014"]
          # additional_dependencies: ['<dbt-adapter>', 'sqlfluff-templater-dbt']

    # Mixed

    - repo: https://github.com/jumanjihouse/pre-commit-hooks
      rev: 3.0.0
      hooks:
          - id: script-must-not-have-extension

    - repo: https://github.com/Lucas-C/pre-commit-hooks
      rev: v1.5.6
      hooks:
          - id: remove-crlf
          - id: remove-tabs
            exclude: .git/COMMIT_EDITMSG

    - repo: https://github.com/sirosen/check-jsonschema
      rev: 0.37.4
      hooks:
          - id: check-github-actions
          - id: check-github-workflows
          - id: check-readthedocs

    - repo: https://github.com/sirwart/ripsecrets
      rev: v0.1.11 # Use latest tag on GitHub
      hooks:
          - id: ripsecrets
            # Excludes notebooks whose committed base64 image/png outputs are
            # flagged as high-entropy secrets by ripsecrets.
            exclude: |
                (?x)^(
                  projects/gilbert-shannon-reeds/Gilbert-Shannon-Reeds\.ipynb|
                  projects/gilbert-shannon-reeds/Gilbert-Shannon-Reeds\.html|
                  projects/heart-disease/1\.0-initial-data-exploration\.ipynb|
                  projects/heart-disease/1\.1-data-exploration-matplotlib\.ipynb|
                  projects/heart-disease/1\.2-data-exploration-seaborn\.ipynb|
                  projects/heart-disease/1\.3-data-exploration-plotly\.ipynb
                )$
          # uncomment to check additional patterns
          # args:
          # - --additional-pattern 'mytoken*'
          # - --additional-pattern 'mykey*'

    - repo: https://github.com/rhysd/actionlint
      rev: v1.7.12
      hooks:
          - id: actionlint

    - repo: https://github.com/MarcoGorelli/cython-lint
      rev: v0.21.0
      hooks:
          - id: cython-lint

    - repo: https://github.com/lycheeverse/lychee.git
      rev: v0.15.1
      hooks:
          - id: lychee
            args: ["--config", "lychee.toml"]
            # Excludes the nbconvert-generated HTML export, which references its own
            # local bootstrap/font-awesome/custom.css assets that were never committed.
            exclude: |
                (?x)^(
                  projects/gilbert-shannon-reeds/Gilbert-Shannon-Reeds\.html
                )$
